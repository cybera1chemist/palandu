<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f8">
    <title>帕拉恩度</title>
    <link rel="stylesheet" href="./assets/css/style.css">
  </head>
  <body class="home-page">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="帕拉恩度主页">
        <img src="./assets/images/Logo.png" alt="帕拉恩度 Logo">
      </a>
      <div class="user-avatar" id="user-avatar" aria-label="当前用户"></div>
    </header>

    <div class="page-layout">
      <aside class="sidebar" aria-label="主导航">
        <nav class="navigation">
          <button class="nav-item is-active" type="button" data-section="主页">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
            <span>主页</span>
          </button>
          <button class="nav-item" type="button" data-section="公告">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13V8a2 2 0 0 1 2-2h3l8-3v17l-8-3H6a2 2 0 0 1-2-2v-2m4 1 2 6m7-13h2a2 2 0 0 1 0 8h-2"/></svg>
            <span>公告</span>
          </button>
          <button class="nav-item" type="button" data-section="空间">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
            <span>空间</span>
          </button>
          <button class="nav-item" type="button" data-section="消息">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6a7.5 7.5 0 1 1 17-3.5Z"/></svg>
            <span>消息</span>
          </button>
          <button class="nav-item" type="button" data-section="我">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span>我</span>
          </button>
        </nav>
        <button class="nav-item logout-button" id="logout-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
          <span>退出登录</span>
        </button>
      </aside>

      <main class="main-content">
        <section class="home-view" id="home-view">
          <h1 class="welcome-heading">欢迎，<span id="welcome-nickname"></span></h1>
          <div class="dashboard-grid">
            <section class="dashboard-card" aria-labelledby="recent-announcements-title">
              <h2 id="recent-announcements-title">最近公告</h2>
              <ul class="recent-list" id="recent-announcements"></ul>
              <div class="card-footer">
                <button class="text-button" type="button" data-open-section="公告">查看全部公告</button>
              </div>
            </section>

            <section class="dashboard-card" aria-labelledby="recent-files-title">
              <h2 id="recent-files-title">最近文件</h2>
              <ul class="recent-list">
                <li class="empty-state">暂无文件</li>
              </ul>
              <div class="card-footer">
                <button class="text-button" type="button" data-open-section="空间">查看全部文件</button>
              </div>
            </section>
          </div>
        </section>

        <section class="announcements-view" id="announcements-view" aria-labelledby="section-title" hidden>
          <h1 id="section-title">公告</h1>
          <ul class="announcement-list" id="announcement-list"></ul>
        </section>

        <section class="profile-view" id="profile-view" aria-labelledby="profile-nickname" hidden>
          <header class="profile-header">
            <div class="user-avatar profile-avatar" id="profile-avatar"></div>
            <h1 id="profile-nickname"></h1>
          </header>
          <dl class="profile-details">
            <div class="profile-row">
              <dt>账号</dt>
              <dd id="profile-id"></dd>
            </div>
            <div class="profile-row">
              <dt>密码</dt>
              <dd class="password-value">
                <span id="profile-password"></span>
                <button class="password-toggle" id="password-toggle" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="eye-slash" id="password-eye-slash" d="m4 4 16 16"/>
                  </svg>
                </button>
              </dd>
            </div>
            <div class="profile-row">
              <dt>性别</dt>
              <dd id="profile-gender"></dd>
            </div>
            <div class="profile-row">
              <dt>年龄</dt>
              <dd id="profile-age"></dd>
            </div>
            <div class="profile-row">
              <dt>部门</dt>
              <dd id="profile-department"></dd>
            </div>
            <div class="profile-row">
              <dt>权限等级</dt>
              <dd id="profile-level"></dd>
            </div>
          </dl>
        </section>

        <section class="placeholder-view" id="placeholder-view" hidden>
          <h1 id="placeholder-title"></h1>
        </section>
      </main>
    </div>
    <script type="module" src="./assets/js/home.js"></script>
  </body>
</html>
