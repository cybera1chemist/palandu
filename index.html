<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f8">
    <title>帕拉恩度</title>
    <link rel="stylesheet" href="./assets/css/style.css">
  </head>
  <body class="home-page">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="帕拉恩度主页">
        <img src="./assets/images/Logo.png" alt="帕拉恩度 Logo">
      </a>
      <div class="user-avatar" id="user-avatar" aria-label="当前用户"></div>
    </header>

    <div class="page-layout">
      <aside class="sidebar" aria-label="主导航">
        <nav class="navigation">
          <button class="nav-item is-active" type="button" data-section="主页">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="./assets/icons/home.svg#icon-home"></use></svg>
            <span>主页</span>
          </button>
          <button class="nav-item" type="button" data-section="公告">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="./assets/icons/notice.svg#icon-notice"></use></svg>
            <span>公告</span>
          </button>
          <button class="nav-item" type="button" data-section="空间">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="./assets/icons/workspace.svg#icon-workspace"></use></svg>
            <span>空间</span>
          </button>
          <button class="nav-item" type="button" data-section="消息">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="./assets/icons/messages.svg#icon-messages"></use></svg>
            <span>消息</span>
          </button>
          <button class="nav-item" type="button" data-section="我">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="./assets/icons/user.svg#icon-user"></use></svg>
            <span>我</span>
          </button>
        </nav>
        <button class="nav-item logout-button" id="logout-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="./assets/icons/log-out.svg#icon-log-out"></use></svg>
          <span>退出登录</span>
        </button>
      </aside>

      <main class="main-content">
        <section class="home-view" id="home-view">
          <h1 class="welcome-heading">欢迎，<span id="welcome-nickname"></span></h1>
          <div class="dashboard-grid">
            <section class="dashboard-card" aria-labelledby="recent-announcements-title">
              <h2 id="recent-announcements-title">最近公告</h2>
              <ul class="recent-list" id="recent-announcements"></ul>
              <div class="card-footer">
                <button class="text-button" type="button" data-open-section="公告">查看全部公告</button>
              </div>
            </section>

            <section class="dashboard-card" aria-labelledby="recent-files-title">
              <h2 id="recent-files-title">最近文件</h2>
              <ul class="recent-list" id="recent-files"></ul>
              <div class="card-footer">
                <button class="text-button" type="button" data-open-section="空间">查看全部文件</button>
              </div>
            </section>
          </div>
        </section>

        <section class="announcements-view" id="announcements-view" aria-labelledby="section-title" hidden>
          <h1 id="section-title">公告</h1>
          <ul class="announcement-list" id="announcement-list"></ul>
        </section>

        <section class="workspace-view" id="workspace-view" aria-label="空间" hidden>
          <nav class="workspace-breadcrumbs" id="workspace-breadcrumbs" aria-label="文件夹路径"></nav>
          <div class="workspace-items" id="workspace-items" aria-live="polite"></div>
        </section>

        <section class="messages-view" id="messages-view" aria-label="消息" hidden>
          <aside class="conversation-sidebar" aria-label="对话列表">
            <h1>消息</h1>
            <div class="conversation-list" id="conversation-list"></div>
          </aside>
          <section class="chat-panel" aria-label="对话内容">
            <header class="chat-header">
              <div class="user-avatar chat-header-avatar" id="chat-contact-avatar"></div>
              <h2 id="chat-contact-name"></h2>
            </header>
            <ol class="chat-messages" id="chat-messages" aria-live="polite"></ol>
            <div class="message-compose">
              <label class="visually-hidden" for="message-draft">输入消息</label>
              <textarea id="message-draft" placeholder="输入消息..." rows="1"></textarea>
              <button class="send-message-button" type="button" aria-label="发送消息">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2-8zM11 13l5-5"/></svg>
              </button>
            </div>
          </section>
        </section>

        <section class="profile-view" id="profile-view" aria-labelledby="profile-nickname" hidden>
          <header class="profile-header">
            <div class="user-avatar profile-avatar" id="profile-avatar"></div>
            <h1 id="profile-nickname"></h1>
          </header>
          <dl class="profile-details">
            <div class="profile-row">
              <dt>账号</dt>
              <dd id="profile-id"></dd>
            </div>
            <div class="profile-row">
              <dt>密码</dt>
              <dd class="password-value">
                <span id="profile-password"></span>
                <button class="password-toggle" id="password-toggle" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="eye-slash" id="password-eye-slash" d="m4 4 16 16"/>
                  </svg>
                </button>
              </dd>
            </div>
            <div class="profile-row">
              <dt>性别</dt>
              <dd id="profile-gender"></dd>
            </div>
            <div class="profile-row">
              <dt>年龄</dt>
              <dd id="profile-age"></dd>
            </div>
            <div class="profile-row">
              <dt>部门</dt>
              <dd id="profile-department"></dd>
            </div>
            <div class="profile-row">
              <dt>权限等级</dt>
              <dd id="profile-level"></dd>
            </div>
          </dl>
        </section>

      </main>
    </div>
    <dialog class="download-dialog" id="file-download-dialog" aria-labelledby="download-dialog-title">
      <div class="download-dialog-content">
        <h2 id="download-dialog-title">下载文件</h2>
        <p>是否要下载该文件？</p>
        <p class="download-file-name" id="download-file-name"></p>
        <div class="download-dialog-actions">
          <button class="dialog-cancel-button" id="download-cancel" type="button">取消</button>
          <button class="primary-button dialog-confirm-button" id="download-confirm" type="button">确认下载</button>
        </div>
      </div>
    </dialog>
    <dialog class="download-dialog" id="workspace-password-dialog" aria-labelledby="workspace-password-title">
      <form class="download-dialog-content password-form" id="workspace-password-form">
        <h2 id="workspace-password-title">输入密码</h2>
        <p id="workspace-password-hint"></p>
        <label class="visually-hidden" for="workspace-password-input">文件密码</label>
        <input
          class="password-input"
          id="workspace-password-input"
          type="password"
          inputmode="numeric"
          pattern="[0-9]{4}"
          maxlength="4"
          autocomplete="off"
          required
        >
        <p class="password-error" id="workspace-password-error" role="alert" hidden>密码错误，请重试。</p>
        <div class="download-dialog-actions">
          <button class="dialog-cancel-button" id="workspace-password-cancel" type="button">取消</button>
          <button class="primary-button dialog-confirm-button" type="submit">确认</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./assets/js/home.js"></script>
  </body>
</html>
